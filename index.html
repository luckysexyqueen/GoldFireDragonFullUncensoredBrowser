            backdrop-filter: blur(20px);

        .search-bar:focus-within {

        }

        .no-login-badge {
            background: linear-gradient(90deg, #eab308, #fef08a);
            color: #713f12; padding: 6px 14px; border-radius: 9999px;
            font-size: 12px; font-weight: 900; box-shadow: 0 0 16px rgba(234, 179, 8, 0.6);
        }

        #apps-popup {
            display: none; position: fixed; top: 70px; right: 20px;
            background: rgba(12, 4, 28, 0.97); border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 16px; padding: 16px; z-index: 600; width: 280px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
        #apps-popup.open { display: block; }

        #joystick-zone {
            position: fixed !important; bottom: 40px !important; left: 40px !important;
            width: 130px !important; height: 130px !important; z-index: 2147483647 !important;
            border-radius: 50% !important; background: rgba(168, 85, 247, 0.15) !important;
            border: 3px dashed rgba(192, 132, 252, 0.6) !important;
        }

        canvas.three-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999999; display: block;
        }

        .hidden-content { display: none !important; }
    </style>
</head>
<body>

    <!-- 360 Panorama VR Background -->
    <div id="xr-bg-container">
        <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-assets>
                <img id="bg-360" src="https://cdn.jsdelivr.net/gh/luckysexysuccubusqueen135age/GoldFireDragonFullUnCensoredGoogleProxyInAndroidWebBrowserAppHomePage@50937264e913e22f347e83e928724669963b2565/images/GoldFireDragonBrowser_home_page.jpg" crossorigin="anonymous" />
            </a-assets>
            <a-sky src="#bg-360" rotation="0 -90 0"></a-sky>
            <a-entity id="camera-rig" position="0 1.6 0">
                <a-camera id="main-camera" look-controls="pointerLockEnabled: false; touchEnabled: true"></a-camera>

        </a-scene>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <header class="flex justify-between items-center px-4 py-3 gap-2 z-50 flex-wrap clickable" style="background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent)">
            <div class="flex items-center gap-2">
                <div class="japan-wifi">🇯🇵 Japan WiFi IP</div>
                <div class="no-login-badge">🔓 무로그인 전체우회 모드</div>
            </div>
            <div class="flex items-center gap-3">
                <button id="fullscreen-btn" class="px-4 py-2 bg-purple-600 rounded-full text-xs font-bold hover:bg-purple-500 transition">🖥️ 전체화면</button>
                <button id="apps-btn" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition"><i class="fa-solid fa-grip text-purple-300 text-lg"></i></button>
                <button id="toggle-ui-btn" class="w-10 h-10 flex items-center justify-center rounded-full bg-black/50 border border-purple-500 text-lg">👁️</button>
            </div>
        </header>

        <main id="main-content" class="flex-1 flex flex-col items-center justify-center px-4">
            <div class="mb-8 text-center">
                <img src="https://cdn.jsdelivr.net/gh/luckysexysuccubusqueen135age/GFD@a81b2430450dcf18c49813c55be06c6ee0ad256f/images/GoldFireDragonBrowser_logo_removebg_preview.png" class="mx-auto w-32 drop-shadow-lg" alt="Logo" />
                <p class="text-purple-300 text-sm mt-2">로그인 없이 자유로운 360° XR 무제한 우회 브라우저</p>
            </div>

            <div class="w-full max-w-2xl relative clickable">
                <div class="search-bar flex items-center px-5 py-3">
                    <i class="fa-solid fa-magnifying-glass text-purple-400 mr-4"></i>
                    <input id="search-input" type="text" class="flex-1 bg-transparent outline-none text-purple-100" placeholder="검색어 또는 URL 주소를 입력하세요" />
                    <button id="voice-btn" class="text-purple-400 hover:text-white mx-2"><i class="fa-solid fa-microphone"></i></button>
                    <button id="lens-btn" class="text-purple-400 hover:text-white"><i class="fa-solid fa-camera"></i></button>
                </div>
            </div>

            <div class="flex justify-center gap-3 mt-8 flex-wrap clickable">
                <button id="search-btn" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-xl text-sm font-bold shadow-lg">GoldFireDragon 검색</button>
                <button id="bypass-btn" class="px-6 py-3 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 rounded-xl text-sm font-bold text-white shadow-lg">🔥 무로그인 강력 우회</button>
                <button id="croxy-btn" class="px-6 py-3 border border-emerald-500 text-emerald-300 rounded-xl text-sm font-bold hover:bg-emerald-500/10">🛡️ CroxyProxy 우회</button>
            </div>
        </main>

        <div id="apps-popup" class="clickable">
            <p class="text-purple-400 text-xs mb-3 font-bold">빠른 링크 (로그인 우회)</p>
            <div class="grid grid-cols-3 gap-2">
                <a href="https://www.youtube.com" target="_blank" class="flex flex-col items-center p-2 rounded hover:bg-purple-500/20 text-xs text-purple-200"><i class="fa-brands fa-youtube text-xl mb-1"></i>YouTube</a>
                <a href="https://mail.google.com" target="_blank" class="flex flex-col items-center p-2 rounded hover:bg-purple-500/20 text-xs text-purple-200"><i class="fa-solid fa-envelope text-xl mb-1"></i>Gmail</a>
                <a href="https://maps.google.com" target="_blank" class="flex flex-col items-center p-2 rounded hover:bg-purple-500/20 text-xs text-purple-200"><i class="fa-solid fa-map-location-dot text-xl mb-1"></i>Maps</a>
            </div>
        </div>

        <!-- Supabase Results Panel -->
        <div id="supabase-results-panel" class="hidden absolute right-6 top-24 w-96 max-h-[70vh] bg-black/85 border border-purple-500 rounded-xl p-4 overflow-y-auto z-[600] shadow-[0_0_30px_rgba(168,85,247,0.5)] backdrop-blur-md flex-col clickable">
            <div class="flex justify-between items-center mb-3 border-b border-purple-800 pb-2">
                <h3 class="text-purple-300 text-sm font-bold"><i class="fa-solid fa-bolt text-yellow-400 mr-2"></i>Supabase 바이패스 분석</h3>
                <button onclick="document.getElementById('supabase-results-panel').classList.add('hidden')" class="text-purple-400 hover:text-white">✕</button>
            </div>
            <div id="supabase-results" class="text-xs text-gray-300 break-all whitespace-pre-wrap flex-1 overflow-y-auto">대기 중...</div>
        </div>
    </div>

    <div id="joystick-zone"></div>

    <script>
        // --- 1. Auth Bypass Logic ---
        (function() {
            try {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("adult_verified", "true");
                document.cookie = "age_verified=1; path=/; max-age=31536000";
                document.cookie = "adult_auth=true; path=/; max-age=31536000";
            } catch(e) {}
        })();

        // --- 2. Joystick Controls ---
        window.globalJoystickData = { x: 0, y: 0, isMoving: false };
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '65px', bottom: '65px' },
            color: '#a855f7'
        });

        joystick.on('move', (evt, data) => {
            if (data.vector) {
                window.globalJoystickData.x = data.vector.x;
                window.globalJoystickData.y = data.vector.y;
                window.globalJoystickData.isMoving = true;
            }
        });
        joystick.on('end', () => {
            window.globalJoystickData.isMoving = false;
        });

        // A-Frame movement component
        AFRAME.registerComponent('joystick-move', {
            tick: function(time, timeDelta) {
                if (!window.globalJoystickData.isMoving) return;
                const camera = document.getElementById('main-camera');
                const rig = document.getElementById('camera-rig');
                const rotation = camera.getAttribute('rotation');
                const rad = THREE.MathUtils.degToRad(rotation.y);
                
                const speed = 0.1;
                const moveX = -Math.sin(rad) * window.globalJoystickData.y + Math.cos(rad) * window.globalJoystickData.x;
                const moveZ = -Math.cos(rad) * window.globalJoystickData.y - Math.sin(rad) * window.globalJoystickData.x;
                
                const pos = rig.getAttribute('position');
                rig.setAttribute('position', {
                    x: pos.x + moveX * speed,
                    y: pos.y,
                    z: pos.z + moveZ * speed
                });
            }
        });
        document.querySelector('a-scene').setAttribute('joystick-move', '');

        // --- 3. UI Interactions ---
        const searchInput = document.getElementById('search-input');
        const appsBtn = document.getElementById('apps-btn');
        const appsPopup = document.getElementById('apps-popup');
        const toggleUiBtn = document.getElementById('toggle-ui-btn');
        const mainContent = document.getElementById('main-content');

        appsBtn.onclick = () => appsPopup.classList.toggle('open');
        toggleUiBtn.onclick = () => mainContent.classList.toggle('hidden-content');
        
        document.getElementById('fullscreen-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        const performSearch = async (bypass = false) => {
            const query = searchInput.value.trim();
            if (!query) return;

            // Show Supabase Panel for analysis simulation
            const panel = document.getElementById('supabase-results-panel');
            const resultsDiv = document.getElementById('supabase-results');
            panel.classList.remove('hidden');
            panel.classList.add('flex');
            resultsDiv.innerText = `분석 중: ${query}...`;

            try {
                // Simulate Supabase Edge Function call
                const response = await fetch("https://zuhevuyotcigibupboaz.supabase.co/functions/v1/search-bypass", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query, timestamp: new Date().toISOString() })
                });
                const data = await response.json();
                resultsDiv.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                resultsDiv.innerText = "분석 데이터를 불러오지 못했습니다. (네트워크 확인 필요)";
            }

            let url = "";
            if (query.startsWith('http')) {
                url = bypass ? `https://www.croxyproxy.com/_proxy/python/index.php?q=${btoa(query)}` : query;
            } else {
                url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
            window.open(url, '_blank');
        };

        document.getElementById('search-btn').onclick = () => performSearch(false);
        document.getElementById('bypass-btn').onclick = () => performSearch(true);
        document.getElementById('croxy-btn').onclick = () => {
            const query = searchInput.value.trim();
            window.open(`https://www.croxyproxy.com/`, '_blank');
        };

        searchInput.onkeydown = (e) => { if (e.key === 'Enter') performSearch(false); };

        // --- 4. 360 Video Conversion (Three.js) ---
        let isConverted = false;
        let scene, camera, renderer, texture, mesh;

        const detectVideo = setInterval(() => {
            if (isConverted) return;
            const videos = document.querySelectorAll('video');
            videos.forEach(v => {
                if (!v.paused && v.currentTime > 0) start360Video(v);
            });
        }, 1000);

        function start360Video(video) {
            isConverted = true;
            clearInterval(detectVideo);
            video.style.display = 'none';

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
            
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            
            texture = new THREE.VideoTexture(video);
            const material = new THREE.MeshBasicMaterial({ map: texture });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.className = 'three-canvas';
            document.body.appendChild(renderer.domElement);

            // Interaction for 360 video
            let lon = 0, lat = 0;
            document.addEventListener('pointermove', (e) => {
                if (e.buttons > 0) {
                    lon -= e.movementX * 0.1;
                    lat += e.movementY * 0.1;
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                lat = Math.max(-85, Math.min(85, lat));
                const phi = THREE.MathUtils.degToRad(90 - lat);
                const theta = THREE.MathUtils.degToRad(lon);
                const target = new THREE.Vector3();
                target.x = Math.sin(phi) * Math.cos(theta);
                target.y = Math.cos(phi);
                target.z = Math.sin(phi) * Math.sin(theta);
                camera.lookAt(target);
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
