  <script>
    // 글로벌 조이스틱 데이터 정의
    window.globalJoystickData = { x: 0, y: 0, isMoving: false };

    // Rig를 이용한 안정적인 이동 컴포넌트
    AFRAME.registerComponent('joystick-controls', {
      schema: { speed: { default: 0.15 } }, 
      tick: function (time, timeDelta) {
        if (!window.globalJoystickData || !window.globalJoystickData.isMoving) return;
        
        const el = this.el;
        const deltaSpeed = this.data.speed * (Math.min(timeDelta, 50) / 16.6);

        const inputX = window.globalJoystickData.x;
        const inputY = window.globalJoystickData.y;

        const camera = document.getElementById('main-camera');
        if(!camera) return;
        
        const rotationY = camera.getAttribute('rotation').y;
        const rad = THREE.MathUtils.degToRad(rotationY);

        const moveX = -Math.sin(rad) * inputY + Math.cos(rad) * inputX;
        const moveZ = -Math.cos(rad) * inputY - Math.sin(rad) * inputX;

        el.object3D.position.x += moveX * deltaSpeed;
        el.object3D.position.z += moveZ * deltaSpeed;
      }
    });
  </script>

  <script>
    window.addEventListener('load', function() {
      const cameraEl = document.getElementById('main-camera');
      if (cameraEl && cameraEl.components && cameraEl.components['look-controls']) {
        cameraEl.components['look-controls'].pitchObject.rotation.x = 0;
        cameraEl.components['look-controls'].yawObject.rotation.y = 0;
      }
    });

    window.addEventListener('load', function() {
      const zone = document.getElementById('joystick-zone');
      if (!zone) return;

      const stopPropagation = (e) => e.stopPropagation();
      zone.addEventListener('mousedown', stopPropagation);
      zone.addEventListener('touchstart', stopPropagation, { passive: false });
      zone.addEventListener('pointerdown', stopPropagation);

      const manager = nipplejs.create({
        zone: zone,
        mode: 'static',
        position: { left: '50%', top: '50%' },
        color: '#c084fc',
        size: 100, 
        restOpacity: 0.8
      });

      manager.on('move', (evt, data) => {
        if (!data || !data.angle) return;
        window.globalJoystickData.isMoving = true;
        const force = Math.min(data.force || 1, 1);
        window.globalJoystickData.x = Math.cos(data.angle.radian) * force;
        window.globalJoystickData.y = Math.sin(data.angle.radian) * force;
      });

      manager.on('end', () => {
        window.globalJoystickData.isMoving = false;
        window.globalJoystickData.x = 0;
        window.globalJoystickData.y = 0;
      });
    });

    (function() {
      const coreStyleContent = 'html,body{width:100%!important;height:100%!important;margin:0!important;padding:0!important;box-sizing:border-box!important;}*,*::before,*::after{box-sizing:inherit!important;image-rendering:-webkit-optimize-contrast!important;filter:contrast(102%) saturate(105%) brightness(100%)!important;}html{filter:contrast(110%) saturate(110%) brightness(102%)!important;will-change:filter!important;';
      const applyHdrFramework = function(targetDoc) {
          if (!targetDoc || targetDoc.getElementById('forced-hdr-core-style')) return;
          try {
              var style = targetDoc.createElement('style');
              style.id = 'forced-hdr-core-style';
              style.innerHTML = coreStyleContent;
              targetDoc.head.appendChild(style);
          } catch(e) {}
      };
      
      let hdrTimeout;
      const spreadHdrVirus = function() {
          clearTimeout(hdrTimeout);
          hdrTimeout = setTimeout(() => {
              applyHdrFramework(document);
              document.querySelectorAll('a[href]:not(.hdr-infected)').forEach(function(link) {
                  link.classList.add('hdr-infected');
                  link.addEventListener('click', function() { applyHdrFramework(document); });
              });
          }, 100);
      };
      window.addEventListener('DOMContentLoaded', spreadHdrVirus);
      window.addEventListener('pageshow', spreadHdrVirus);
      var observer = new MutationObserver(spreadHdrVirus);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();

    function fitHybridLayout() {
      const uiLayer = document.getElementById('ui-layer');
      if (!uiLayer) return;
      const deviceWidth = window.innerWidth;
      const deviceHeight = window.innerHeight;
      const isPortrait = deviceHeight > deviceWidth;
      const baseWidth = isPortrait ? 900 : 1500;
      const baseHeight = isPortrait ? 1500 : 900;
      
      uiLayer.style.setProperty('width', baseWidth + 'px', 'important');
      uiLayer.style.setProperty('height', baseHeight + 'px', 'important');
      
      const scaleX = deviceWidth / baseWidth;
      const scaleY = deviceHeight / baseHeight;
      uiLayer.style.transform = 'scale(' + scaleX + ', ' + scaleY + ')';
    }

    window.addEventListener('DOMContentLoaded', fitHybridLayout, false);
    window.addEventListener('resize', fitHybridLayout, false);

    document.addEventListener('DOMContentLoaded', function () {
      var input = document.getElementById('search-input');
      var searchBtn = document.getElementById('search-btn');
      var luckyBtn = document.getElementById('lucky-btn');
      var croxyBtn = document.getElementById('croxy-btn');
      
      var toggleBtn = document.getElementById('toggle-main-btn');
      var mainContent = document.getElementById('main-content');
      var footer = document.getElementById('main-footer');
      var isHidden = false;
      
      var fullscreenBtnTop = document.getElementById('fullscreen-btn-top');
      var appsBtn = document.getElementById('apps-btn');
      var appsPopup = document.getElementById('apps-popup');
      var clearBtn = document.getElementById('clear-btn');
      var suggestions = document.getElementById('suggestions');

      fullscreenBtnTop.addEventListener('click', function () {
        const docElem = document.documentElement;
        const requestFS = docElem.requestFullscreen || docElem.mozRequestFullScreen || docElem.webkitRequestFullscreen || docElem.msRequestFullscreen;
        const exitFS = document.exitFullscreen || document.mozCancelFullScreen || document.webkitExitFullscreen || document.msExitFullscreen;

        if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
          if(requestFS) requestFS.call(docElem).then(() => setTimeout(fitHybridLayout, 100)).catch(e => console.error(e));
        } else {
          if(exitFS) exitFS.call(document).then(() => setTimeout(fitHybridLayout, 100));
        }
      });

      const handleFSChange = () => {
        const isFS = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        fullscreenBtnTop.innerHTML = isFS ? '<i class="fa-solid fa-compress"></i> 🖥️ 전체화면 해제' : '<i class="fa-solid fa-expand"></i> 🖥️ 전체화면';
        setTimeout(fitHybridLayout, 100);
      };

      document.addEventListener('fullscreenchange', handleFSChange);
      document.addEventListener('webkitfullscreenchange', handleFSChange);
      document.addEventListener('mozfullscreenchange', handleFSChange);

      // ==========================================================
      // [실제 작동형] 검색창과 로고 토글 제어 로직
      // ==========================================================
      function handleToggleAction(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        
        isHidden = !isHidden;

        if (isHidden) {
          // 검색창과 로고가 포함된 main 영역을 화면에서 완전히 제거
          mainContent.classList.add('force-hidden');
          if (footer) footer.classList.add('force-hidden');
          
          // 눈 감은 아이콘으로 변경
          toggleBtn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
        } else {
          // 검색창과 로고 다시 표시
          mainContent.classList.remove('force-hidden');
          if (footer) footer.classList.remove('force-hidden');
          
          // 기본 눈 아이콘으로 복구
          toggleBtn.innerHTML = '👁️';
        }
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', handleToggleAction);
        toggleBtn.addEventListener('touchend', handleToggleAction);
      }
      // ==========================================================

      appsBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        appsPopup.classList.toggle('open');
      });
      document.addEventListener('click', function () { appsPopup.classList.remove('open'); });

      function openSearch(keyword, lucky) {
        keyword = (keyword || '').trim();
        if (!keyword) { input.focus(); return; }
        const searchUrl = `https://www.google.co.jp/search?q=${encodeURIComponent(keyword)}&gl=jp&hl=ko&safe=off&nfpr=1&filter=0&pws=0&desktop=true&adult=true&age=19&is_adult=Y&adult_auth=true` + (lucky ? '&btnI=1' : '');
        window.location.href = searchUrl;
      }

      searchBtn.addEventListener('click', function () { openSearch(input.value, false); });
      luckyBtn.addEventListener('click', function () { openSearch(input.value, true); });

      croxyBtn.addEventListener('click', function () {
        var q = (input.value || '').trim();
        if (!q) { input.focus(); return; }
        var isURL = /^https?:\/\//i.test(q) || /^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(\/.*)?$/.test(q);
        var targetUrl = isURL ? q : `https://www.google.co.jp/search?q=${encodeURIComponent(q)}&gl=jp&hl=ko&safe=off&nfpr=1&filter=0&pws=0&desktop=true&adult=true&age=19&is_adult=Y&adult_auth=true`;
        window.location.href = 'https://www.croxyproxy.com/_ko/?__cpLangSet=1&url=' + encodeURIComponent(targetUrl);
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { openSearch(input.value, false); hideSuggestions(); }
      });

      input.addEventListener('input', function () {
        clearBtn.classList.toggle('hidden', !input.value);
        if (input.value.length >= 2) fetchSuggestions(input.value);
        else hideSuggestions();
      });

      clearBtn.addEventListener('click', function () {
        input.value = ''; clearBtn.classList.add('hidden'); hideSuggestions(); input.focus();
      });

      var suggestTimer = null;
      var scriptCounter = 0;
      function fetchSuggestions(query) {
        clearTimeout(suggestTimer);
        suggestTimer = setTimeout(function () {
          var cbName = '__fdSuggest_' + (++scriptCounter);
          var scriptEl = document.createElement('script');
          
          window[cbName] = function (data) {
            renderSuggestions(Array.isArray(data[1]) ? data[1] : []);
            scriptEl.remove();
            delete window[cbName];
          };
          
          scriptEl.onerror = function() {
            scriptEl.remove();
            delete window[cbName];
          };

          scriptEl.src = 'https://suggestqueries.google.co.jp/complete/search?client=firefox&q=' + encodeURIComponent(query) + '&gl=jp&hl=ko&callback=' + cbName;
          document.body.appendChild(scriptEl);
        }, 250);
      }

      function renderSuggestions(items) {
        if (!items.length) { hideSuggestions(); return; }
        suggestions.innerHTML = '';
        items.slice(0, 6).forEach(function (text) {
          var li = document.createElement('li');
          li.innerHTML = '<i class="fa-solid fa-magnifying-glass text-purple-500"></i><span>' + text + '</span>';
          li.addEventListener('mousedown', function (e) {
            e.preventDefault();
            input.value = text;
            openSearch(text, false);
          });
          suggestions.appendChild(li);
        });
        suggestions.classList.remove('hidden');
      }
      function hideSuggestions() { suggestions.classList.add('hidden'); }
    });
  </script>
